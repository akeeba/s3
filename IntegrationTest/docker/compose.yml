# Garage, an S3-compatible server, for the GARAGE environment of .env.test
#
#   composer garage:up      start it, lay out its storage, import the access key, create the `test` bucket
#   composer garage:down    stop it and throw the data away
#
# The image is pinned. Set GARAGE_IMAGE to use another one. The S3 API is published on 127.0.0.1:3900; set
# GARAGE_PORT to use another host port (and change GARAGE_ENDPOINT in .env.test to match).
#
# Garage is not usable straight after it starts and its image has no shell, so provision.sh does the rest through
# `docker compose exec`. It only supports v4 signatures.
name: akeeba-s3-tests

services:
  garage:
    image: ${GARAGE_IMAGE:-dxflrs/garage:v2.5.0}
    ports:
      - "127.0.0.1:${GARAGE_PORT:-3900}:3900"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 2s
      timeout: 5s
      retries: 30
