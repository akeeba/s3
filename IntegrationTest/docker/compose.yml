# MinIO, an S3-compatible server, for the MINIO environments of .env.test
#
#   composer minio:up      start it and create the `test` bucket
#   composer minio:down    stop it and throw the data away
#
# The image is pinned. Set MINIO_IMAGE (and MINIO_MC_IMAGE for the bucket-creating client) to use another one.
name: akeeba-s3-tests

services:
  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z}
    command: server /data
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30

  # One-shot: creates the bucket the tests use (MINIO_BUCKET), then exits. It has a profile so that `up --wait` does
  # not start it (waiting on a container which exits fails); run it with
  # `docker compose --profile init run --rm create-bucket`.
  create-bucket:
    profiles: [init]
    image: ${MINIO_MC_IMAGE:-quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/test"
